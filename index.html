<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="Debaleena%20Portfolio.dc.html">
<title>Debaleena Chakraborty | Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
<script src="dp-data.js"></script>
<script src="dp-viz.js"></script>
<script src="dp-nav.js"></script>
<style>
body{margin:0;background:oklch(0.975 0.006 90);color:oklch(0.2 0.01 260);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
a:hover{color:oklch(0.55 0.14 50)}
*{box-sizing:border-box}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes scrollW{to{transform:translateX(var(--w))}}
@keyframes timer164{from{stroke-dashoffset:164}to{stroke-dashoffset:0}}
@keyframes proof{from{transform:scale(1,1)}to{transform:scale(1.2,2.7)}}
@keyframes blinkC{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
  <div data-screen-label="Home" onMouseMove="{{ track }}" style="position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(96px,14vh,140px) clamp(20px,3vw,44px) clamp(28px,5vh,56px);gap:clamp(28px,5vh,56px)">
    <div style="position:absolute;left:clamp(20px,3vw,44px);right:clamp(20px,3vw,44px);top:clamp(20px,3vw,32px);display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;animation:fadeUp .6s both">
      <span style="display:flex;align-items:center;gap:12px">
        <span style="width:44px;height:44px;border-radius:50%;padding:3px;background:conic-gradient(from 180deg,oklch(0.45 0.15 255) 0 50%,oklch(0.55 0.14 50) 50% 100%)"><img src="https://debachaks.github.io/portfolio/images/profile.jpg" alt="Debaleena Chakraborty" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid oklch(0.975 0.006 90)"></span>
        Debaleena Chakraborty · PROTON Lab, ASU
      </span>
      <span style="display:flex;gap:18px"><a href="mailto:debaleena82001@gmail.com">email</a><a href="https://github.com/debachaks">github</a></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:18px;animation:fadeUp .8s .1s both">
      <h1 style="margin:0;font-weight:400;font-size:clamp(52px,7.4vw,124px);line-height:1.04;letter-spacing:-.01em"><span style="display:block;font-family:'Instrument Serif',serif;margin-bottom:.08em">Welcome in.</span><span style="font-family:'Source Serif 4',serif;font-weight:600;font-size:.8em;color:oklch(0.45 0.15 255)">Pick a door</span><span style="font-family:'Instrument Serif',serif">, </span><em style="font-family:'Instrument Serif',serif;color:oklch(0.55 0.14 50)">any door.</em></h1>
      <p style="margin:0;max-width:52ch;font-size:18px;line-height:1.55;opacity:.8">Two ways into Debaleena Chakraborty’s work: her research written up as a paper, or the same career baked into a game.</p>
    </div>

    <div style="display:flex;flex-direction:column;border-top:2px solid oklch(0.2 0.01 260)">
      <button onClick="{{ openLab }}" onMouseEnter="{{ hoverLab }}" onMouseLeave="{{ hoverNone }}" style="position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:24px;align-items:center;padding:clamp(18px,2.6vw,34px) 10px;border:0;border-bottom:2px solid oklch(0.2 0.01 260);cursor:pointer;text-align:left;color:{{ labFg }};background:{{ labBg }};background-image:{{ labLines }};transition:background-color .35s,color .35s;animation:fadeUp .8s .35s both">
        <span style="font-family:'JetBrains Mono',monospace;font-size:14px">01</span>
        <span style="display:flex;flex-direction:column;gap:6px"><span style="font-family:'Source Serif 4',serif;font-weight:600;font-size:clamp(44px,6.4vw,108px);line-height:.92;transform:translateX({{ labShift }});transition:transform .5s cubic-bezier(.2,.7,.2,1)">The Lab</span><span style="font-family:'Source Serif 4',serif;font-size:16px;opacity:.8">Academic · her research as a paper, with scrolling figures and nine publications</span></span>
        <span style="font-family:'Material Symbols Rounded';font-size:clamp(36px,4vw,60px);transform:rotate({{ labRot }});transition:transform .5s">arrow_outward</span>
      </button>
      <button onClick="{{ openKitchen }}" onMouseEnter="{{ hoverKitchen }}" onMouseLeave="{{ hoverNone }}" style="position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) 70px;gap:24px;align-items:center;padding:clamp(18px,2.6vw,34px) 10px;border:0;border-bottom:2px solid oklch(0.2 0.01 260);cursor:pointer;text-align:right;color:{{ kitFg }};background:{{ kitBg }};background-image:{{ kitCheck }};background-size:56px 56px;background-position:0 0,28px 28px;transition:background-color .35s,color .35s;animation:fadeUp .8s .5s both">
        <span style="font-family:'Material Symbols Rounded';font-size:clamp(36px,4vw,60px);transform:rotate({{ kitRot }});transition:transform .5s">arrow_insert</span>
        <span style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(48px,7vw,118px);line-height:.9;transform:translateX({{ kitShift }});transition:transform .5s cubic-bezier(.2,.7,.2,1)">The Kitchen</span><span style="font-size:16px;opacity:.8">Baking · the same career as a game: pantry, mix, oven, bake-off</span></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:14px">02</span>
      </button>
    </div>

    <sc-if value="{{ showPreview }}">
      <div style="position:fixed;left:{{ px }};top:{{ py }};width:min(360px,38vw);pointer-events:none;z-index:10;transform:translate({{ offX }},-110%) rotate({{ tilt }});transition:transform .2s;border-radius:12px;box-shadow:0 30px 60px -20px oklch(0 0 0 / 0.45);background:oklch(0.99 0.003 90);padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid {{ previewBorder }}">
        <div style="aspect-ratio:{{ previewRatio }};border-radius:6px;overflow:hidden;background:{{ previewInner }};padding:6px">{{ previewViz }}</div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px">{{ previewCap }}</span>
      </div>
    </sc-if>
  </div>
</sc-if>

<sc-if value="{{ isLab }}"><dc-import name="AcademicMode" on-home="{{ goHome }}" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isKitchen }}"><dc-import name="BakingMode" on-home="{{ goHome }}" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ showDock }}">
  <div style="position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;display:flex;gap:3px;padding:4px;border-radius:999px;background:oklch(0.2 0.01 260 / 0.92);backdrop-filter:blur(10px);box-shadow:0 12px 30px -12px oklch(0 0 0 / 0.5)">
    <sc-for list="{{ dock }}" as="d" hint-placeholder-count="3"><button onClick="{{ d.go }}" style="display:flex;align-items:center;gap:6px;border:0;cursor:pointer;padding:7px 13px;border-radius:999px;background:{{ d.bg }};color:oklch(0.97 0.01 90);font-family:'JetBrains Mono',monospace;font-size:12px"><span style="font-family:'Material Symbols Rounded';font-size:17px">{{ d.icon }}</span>{{ d.label }}</button></sc-for>
  </div>
</sc-if>
<div ref="{{ wipeRef }}" style="position:fixed;inset:0;z-index:100;pointer-events:none;clip-path:circle(0% at 50% 50%);background:{{ wipeBg }};display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:80px;color:oklch(0.99 0.01 90)">{{ wipeIcon }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'home', to: 'lab', hov: null, x: 0, y: 0, vx: 0, fault: 0, proof: 1 };
  wipeRef = React.createRef();
  componentDidMount() {
    const wait = () => { if (window.makeViz && window.DPData && window.dpShellVals) { this.V = window.makeViz(React); this.D = window.DPData; this.forceUpdate(); } else setTimeout(wait, 60); };
    wait();
    const h = (location.hash || '').slice(1); if (h === 'lab' || h === 'kitchen') this.setState({ view: h });
    this.loop = setInterval(() => { if (this.state.hov) this.setState(s => ({ fault: s.fault + 1, proof: s.proof + 1 })); }, 3000);
  }
  componentWillUnmount() { clearInterval(this.loop); }
  renderVals() {
    const st = this.state, V = this.V, D = this.D || { news: [] };
    const shell = window.dpShellVals ? window.dpShellVals(this) : {};
    const lab = st.hov === 'lab', kit = st.hov === 'kitchen', INK = 'oklch(0.2 0.01 260)';
    return Object.assign(shell, {
            track: e => this.setState(s => ({ x: e.clientX, y: e.clientY, vx: Math.max(-8, Math.min(8, (e.clientX - s.x) * 0.6)) })),
      hoverLab: () => this.setState({ hov: 'lab' }), hoverKitchen: () => this.setState({ hov: 'kitchen' }), hoverNone: () => this.setState({ hov: null }),
      labBg: lab ? 'oklch(0.985 0.004 90)' : 'oklch(0.975 0.006 90 / 0)', labFg: lab ? 'oklch(0.45 0.15 255)' : INK,
      labLines: lab ? 'repeating-linear-gradient(to bottom,transparent 0 31px,oklch(0.45 0.15 255 / 0.12) 31px 32px)' : 'none', labShift: lab ? '24px' : '0px', labRot: lab ? '45deg' : '0deg',
      kitBg: kit ? 'oklch(0.93 0.04 70)' : 'oklch(0.975 0.006 90 / 0)', kitFg: kit ? 'oklch(0.45 0.13 45)' : INK,
      kitCheck: kit ? 'linear-gradient(45deg,oklch(0.99 0.01 80 / 0.4) 25%,transparent 25%,transparent 75%,oklch(0.99 0.01 80 / 0.4) 75%),linear-gradient(45deg,oklch(0.99 0.01 80 / 0.4) 25%,transparent 25%,transparent 75%,oklch(0.99 0.01 80 / 0.4) 75%)' : 'none', kitShift: kit ? '-24px' : '0px', kitRot: kit ? '-45deg' : '0deg',
      showPreview: lab || kit, px: st.x + 'px', py: st.y + 'px', tilt: st.vx + 'deg', offX: kit ? 'calc(-100% - 24px)' : '24px',
      previewBorder: lab ? 'oklch(0.45 0.15 255)' : 'oklch(0.55 0.14 50)', previewInner: lab ? 'oklch(0.17 0.02 200)' : 'oklch(0.95 0.03 70)', previewRatio: lab ? '600/220' : '200/150',
      previewViz: V && (lab || kit) ? (lab ? V.scope('proton', 'oklch(0.68 0.19 30)', st.fault) : V.dough('oklch(0.6 0.14 55)', st.proof)) : null,
      previewCap: lab ? 'Fig. 1 · telemetry, fault flagged' : 'Proofing · the baking game'
    });
  }
}
</script>
</body>
</html>
